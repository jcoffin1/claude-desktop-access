summary = "Claude Desktop Access pour NVDA (bêta)"
description = "Prise en charge expérimentale de l’accessibilité de Claude Desktop avec la parole, le braille, les sons d’activité, la lecture des messages, la navigation et des outils d’assistance. Des essais dans Claude sont nécessaires."
changelog = "Corrige la détection de la lecture à voix haute, l’état d’activité bloqué après la fin d’un outil, la confirmation de fin de réponse lorsque la génération reprend et les analyses répétées d’un historique inchangé. Reste compatible avec NVDA 2026.2 stable."
